[workspace]
members = [
    "crates/plugin-api",
    "crates/core",
    "crates/protocol",
    "crates/agent",
    "crates/c2",
    "crates/builder",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
chamuko-plugin-api = { path = "crates/plugin-api" }
chamuko-core = { path = "crates/core" }
chamuko-protocol = { path = "crates/protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
