[workspace]
members = ["crates/plugin-api", "crates/core", "crates/agent"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
chamuko-plugin-api = { path = "crates/plugin-api" }
chamuko-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"
